<!DOCTYPE html>
<html>
<head>
  <title>SEO AI Tool</title>

  <!-- PDF Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  font-family: Arial;
  background: #f2f4f8;
  padding: 20px;
  text-align: center;
}

.dark {
  background: #0f172a;
  color: white;
}

.box {
  background: white;
  padding: 25px;
  border-radius: 15px;
  max-width: 700px;
  margin: auto;
  box-shadow: 0 0 15px rgba(0,0,0,0.1);
}

.dark .box {
  background: #1e293b;
}

input {
  width: 80%;
  padding: 12px;
  margin: 10px;
}

button {
  padding: 12px 20px;
  border: none;
  background: #2563eb;
  color: white;
  cursor: pointer;
  border-radius: 8px;
}

.card {
  text-align: left;
  margin-top: 20px;
  background: #f9f9f9;
  padding: 18px;
  border-radius: 10px;
}

.ai-box {
  background: #eef4ff;
  padding: 15px;
  border-radius: 10px;
}

.chartBox {
  width: 220px;
  margin: auto;
  margin-top: 20px;
}

.loading {
  display: none;
  margin-top: 10px;
}
</style>
</head>

<body>

<div class="box">

  <h2>SEO AI Analyzer</h2>

  <button onclick="toggleDarkMode()">Dark Mode</button>

  <input id="url" placeholder="Enter website URL">

  <br>

  <button onclick="scan()">Scan</button>
  <button onclick="downloadPDF()">Download PDF</button>
  <button onclick="loadHistory()">History</button>

  <div class="loading" id="loading">Scanning...</div>

  <div class="chartBox">
    <canvas id="scoreChart"></canvas>
  </div>

  <h3 id="scoreText"></h3>

  <div id="result"></div>

</div>

<script>

const API_BASE = "https://seo-ai-tool-s47q.onrender.com";

let scoreChart;

// ================= SCAN =================
async function scan() {

  let url = document.getElementById("url").value;

  if (!url) return alert("Enter URL");

  if (!url.startsWith("http")) {
    url = "https://" + url;
  }

  document.getElementById("loading").style.display = "block";
  document.getElementById("result").innerHTML = "";

  try {

   const res = await fetch(
  `${API_BASE}/analyze?url=${encodeURIComponent(url)}`
);
    const data = await res.json();

    document.getElementById("loading").style.display = "none";

    if (data.error) {
      document.getElementById("result").innerHTML =
        `<div class="card">${data.error}</div>`;
      return;
    }

    let color = "red";
    if (data.score >= 80) color = "green";
    else if (data.score >= 50) color = "orange";

    if (scoreChart) scoreChart.destroy();

    scoreChart = new Chart(
      document.getElementById("scoreChart"),
      {
        type: "doughnut",
        data: {
          datasets: [{
            data: [data.score, 100 - data.score],
            backgroundColor: [color, "#e5e7eb"]
          }]
        },
        options: {
          cutout: "75%",
          plugins: { legend: { display: false } }
        }
      }
    );

    document.getElementById("scoreText").innerText =
      `${data.score} - ${data.status}`;

    document.getElementById("result").innerHTML = `
      <div class="card" id="report">
        <p><b>Website:</b> ${data.url}</p>
        <p><b>Title:</b> ${data.title}</p>
        <p><b>H1:</b> ${data.h1}</p>
        <p><b>Meta:</b> ${data.metaDescription}</p>
        <p><b>Word Count:</b> ${data.wordCount}</p>
        <p><b>Grade:</b> ${data.grade}</p>

        <p><b>SEO Tips:</b></p>
        <ul>
          ${(data.tips || []).map(t => `<li>${t}</li>`).join("")}
        </ul>

        <p><b>AI Report:</b></p>
        <div class="ai-box">
          ${data.aiReport || "No AI Report"}
        </div>
      </div>
    `;

  } catch (err) {
    document.getElementById("loading").style.display = "none";
    document.getElementById("result").innerHTML =
      `<div class="card">Server Error</div>`;
  }
}

// ================= HISTORY =================
async function loadHistory() {

  const res = await fetch(`${API_BASE}/history`);
  const data = await res.json();

  document.getElementById("result").innerHTML =
    data.map(item => `
      <div class="card">
        <p>${item.url}</p>
        <p>${item.score}</p>
        <p>${item.status}</p>
      </div>
    `).join("");
}

// ================= PDF =================
function downloadPDF() {
  const el = document.getElementById("report");
  if (!el) return alert("Scan first!");
  html2pdf().from(el).save("seo-report.pdf");
}

// ================= DARK MODE =================
function toggleDarkMode() {
  document.body.classList.toggle("dark");
}

</script>

</body>
</html>
