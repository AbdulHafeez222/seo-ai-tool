<!DOCTYPE html>
<html>
<head>
  <title>SEO + AEO AI Tool</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body {
  font-family: Arial;
  background: #f2f4f8;
  padding: 20px;
  text-align: center;
}
.dark {
  background: #0f172a;
  color: white;
}
.box {
  background: white;
  padding: 25px;
  border-radius: 15px;
  max-width: 800px;
  margin: auto;
  box-shadow: 0 0 15px rgba(0,0,0,0.1);
}
.dark .box {
  background: #1e293b;
}
input {
  width: 80%;
  padding: 12px;
  margin: 10px;
  border: 1px solid #ddd;
  border-radius: 8px;
}
button {
  padding: 12px 20px;
  border: none;
  background: #2563eb;
  color: white;
  cursor: pointer;
  border-radius: 8px;
  margin: 5px;
  font-weight: 600;
}
button:hover {
  background: #1d4ed8;
}
.card {
  text-align: left;
  margin-top: 20px;
  background: #f9f9f9;
  padding: 18px;
  border-radius: 10px;
}
.ai-box {
  background: #eef4ff;
  padding: 15px;
  border-radius: 10px;
  margin-top: 10px;
}
.chartContainer {
  display: flex;
  justify-content: center;
  gap: 30px;
  flex-wrap: wrap;
  margin: 20px 0;
}
.chartBox {
  position: relative;
  width: 200px;
  height: 200px;
  display: flex;
  align-items: center;
  justify-content: center;
}
canvas {
  width: 100% !important;
  height: 100% !important;
  position: relative;
  z-index: 1;
}
.loading {
  display: none;
  margin-top: 10px;
  font-size: 18px;
}
.centerScore {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 36px;
  font-weight: 700;
  text-align: center;
  line-height: 1;
  pointer-events: none;
  z-index: 9999;
}
.centerScore span {
  display: block;
  font-size: 12px;
  font-weight: 500;
  color: #666;
  margin-top: 2px;
}
.badge {
  display: inline-block;
  padding: 4px 10px;
  border-radius: 12px;
  font-size: 12px;
  font-weight: 600;
  margin-left: 8px;
}
.badge-green { background: #dcfce7; color: #166534; }
.badge-red { background: #fee2e2; color: #991b1b; }
.badge-orange { background: #ffedd5; color: #9a3412; }
h3 {
  margin-top: 25px;
  margin-bottom: 10px;
  color: #1e293b;
  border-bottom: 2px solid #e2e8f0;
  padding-bottom: 8px;
}
.dark h3 {
  color: #f1f5f9;
  border-bottom-color: #334155;
}
.dark .card {
  background: #1e293b;
  color: #ffffff;
  border: 1px solid #334155;
}
.dark .ai-box {
  background: #0f172a;
  color: #e2e8f0;
  border: 1px solid #334155;
}
.dark input {
  background: #1e293b;
  color: white;
  border: 1px solid #334155;
}
.dark .centerScore span {
  color: #94a3b8;
}
.dark .badge-green { background: #14532d; color: #bbf7d0; }
.dark .badge-red { background: #7f1d1d; color: #fecaca; }
.dark .badge-orange { background: #7c2d12; color: #fed7aa; }
ul {
  padding-left: 20px;
}
li {
  margin: 5px 0;
}
</style>
</head>
<body>
<div class="box">
  <h2>🚀 SEO + AEO Analyzer</h2>
  <button onclick="toggleDarkMode()">🌙 Dark Mode</button>
  <input id="url" placeholder="Enter website URL" value="hafeezdigitalstudio.com">
  <br>
  <button onclick="scan()">🔍 Scan Website</button>
  <button onclick="downloadPDF()">📄 Download PDF</button>
  <button onclick="loadHistory()">📊 History</button>
  <div class="loading" id="loading">⏳ Scanning... Please wait</div>
  
  <div class="chartContainer">
    <div class="chartBox">
      <canvas id="seoChart"></canvas>
      <div class="centerScore" id="seoScore"></div>
    </div>
    <div class="chartBox">
      <canvas id="aeoChart"></canvas>
      <div class="centerScore" id="aeoScore"></div>
    </div>
  </div>
  
  <div id="result"></div>
</div>

<script>
const API_BASE = "https://seo-ai-tool-s47q.onrender.com";
let seoChart, aeoChart;

async function scan() {
  let url = document.getElementById("url").value;
  if (!url) return alert("Enter URL");
  if (!url.startsWith("http")) {
    url = "https://" + url;
  }
  
  document.getElementById("loading").style.display = "block";
  document.getElementById("result").innerHTML = "";
  
  try {
    const res = await fetch(`${API_BASE}/analyze?url=${encodeURIComponent(url)}`);
    const data = await res.json();
    document.getElementById("loading").style.display = "none";
    
    if (data.error) {
      document.getElementById("result").innerHTML = `<div class="card">❌ ${data.error}</div>`;
      return;
    }

    // SEO Chart
    let seoColor = data.score >= 80 ? "#16a34a" : data.score >= 50 ? "#f97316" : "#dc2626";
    if (seoChart) seoChart.destroy();
    seoChart = new Chart(document.getElementById("seoChart"), {
      type: "doughnut",
      data: {
        datasets: [{
          data: [data.score || 0, 100 - (data.score || 0)],
          backgroundColor: [seoColor, "#e5e7eb"],
          borderWidth: 0
        }]
      },
      options: {
        cutout: "75%",
        plugins: { legend: { display: false }, tooltip: { enabled: false } }
      }
    });

    let seoGrade = data.score >= 90 ? "A+" : data.score >= 80 ? "A" : data.score >= 60 ? "B" : data.score >= 40 ? "C" : "D";
    document.getElementById("seoScore").innerHTML = `${data.score}<span>SEO ${seoGrade}</span>`;
    document.getElementById("seoScore").style.color = seoColor;

    // AEO Chart
    let aeoColor = data.aeoScore >= 80 ? "#16a34a" : data.aeoScore >= 50 ? "#f97316" : "#dc2626";
    if (aeoChart) aeoChart.destroy();
    aeoChart = new Chart(document.getElementById("aeoChart"), {
      type: "doughnut",
      data: {
        datasets: [{
          data: [data.aeoScore || 0, 100 - (data.aeoScore || 0)],
          backgroundColor: [aeoColor, "#e5e7eb"],
          borderWidth: 0
        }]
      },
      options: {
        cutout: "75%",
        plugins: { legend: { display: false }, tooltip: { enabled: false } }
      }
    });

    let aeoGrade = data.aeoScore >= 90 ? "A+" : data.aeoScore >= 80 ? "A" : data.aeoScore >= 60 ? "B" : data.aeoScore >= 40 ? "C" : "D";
    document.getElementById("aeoScore").innerHTML = `${data.aeoScore}<span>AEO ${aeoGrade}</span>`;
    document.getElementById("aeoScore").style.color = aeoColor;

    // Readability Color
    const readabilityColor = data.readabilityScore >= 60 ? "#16a34a" : data.readabilityScore >= 30 ? "#f97316" : "#dc2626";

    // Result HTML
    document.getElementById("result").innerHTML = `
      <div class="card" id="report">
        <h3>📊 Basic Info</h3>
        <p><b>Website:</b> ${data.url}</p>
        <p><b>Title:</b> ${data.title || 'Not found'}</p>
        <p><b>H1:</b> ${data.h1 || 'Not found'}</p>
        <p><b>Meta Description:</b> ${data.metaDescription || 'Not found'}</p>
        <p><b>Word Count:</b> ${data.wordCount}</p>
        <p><b>Last Modified:</b> ${data.lastModified || 'Not found'}</p>
        
        <h3>📖 Content Quality</h3>
        <p><b>Readability Score:</b> ${data.readabilityScore}/100 <span class="badge" style="background:${readabilityColor}20;color:${readabilityColor}">${data.readabilityStatus}</span></p>
        <p><b>Author Found:</b> ${data.hasAuthor? '<span class="badge badge-green">✅ Yes - EEAT Boost</span>' : '<span class="badge badge-red">❌ No</span>'}</p>
        
        <h3>🚀 AI Citation Probability - Unique Feature</h3>
        <p><b>ChatGPT Citation Chance:</b> ${data.citationChatGPT}% <span class="badge badge-${data.citationChatGPT >= 80? 'green' : data.citationChatGPT >= 50? 'orange' : 'red'}">${data.citationChatGPT >= 80? 'High' : data.citationChatGPT >= 50? 'Medium' : 'Low'}</span></p>
        <p><b>Gemini Citation Chance:</b> ${data.citationGemini}% <span class="badge badge-${data.citationGemini >= 80? 'green' : data.citationGemini >= 50? 'orange' : 'red'}">${data.citationGemini >= 80? 'High' : data.citationGemini >= 50? 'Medium' : 'Low'}</span></p>
        <p><b>Perplexity Citation Chance:</b> ${data.citationPerplexity}% <span class="badge badge-${data.citationPerplexity >= 80? 'green' : data.citationPerplexity >= 50? 'orange' : 'red'}">${data.citationPerplexity >= 80? 'High' : data.citationPerplexity >= 50? 'Medium' : 'Low'}</span></p>

        <h3>🤖 AI Answer Extraction Test</h3>
        <div class="ai-box" style="white-space: pre-wrap; background: #fef3c7; border-left: 4px solid #f59e0b;">
          <b>AI Will Extract:</b><br><br>${data.aiExtractedAnswer || 'No answer found'}
        </div>

        <h3>💎 AEO Simulator - ChatGPT Preview</h3>
        <div class="ai-box" style="white-space: pre-wrap; background: #dbeafe; border-left: 4px solid #3b82f6;">
          <b>If ChatGPT quotes your website:</b><br><br>${data.aeoSimulation || 'No simulation available'}
        </div>
        
        <h3>🔍 SEO Status</h3>
        <p><b>SEO Score:</b> ${data.score}/100 <span class="badge badge-${data.score >= 80 ? 'green' : data.score >= 50 ? 'orange' : 'red'}">${data.status}</span></p>
        <p><b>Images:</b> ${data.totalImages} total, ${data.imagesWithoutAlt} missing ALT text ${data.imagesWithoutAlt > 0 ? '<span class="badge badge-red">⚠️ Fix Needed</span>' : '<span class="badge badge-green">✅ Perfect</span>'}</p>
        <p><b>Internal Links:</b> ${data.internalLinks} | <b>External Links:</b> ${data.externalLinks}</p>
        <p><b>Mobile Friendly:</b> ${data.mobileFriendly? '<span class="badge badge-green">✅ Optimized</span>' : '<span class="badge badge-red">❌ Not Optimized</span>'}</p>
        <p><b>HTTPS:</b> ${data.isHttps? '<span class="badge badge-green">✅ Secure</span>' : '<span class="badge badge-red">❌ Not Secure</span>'}</p>
        <p><b>Load Time:</b> ${data.loadTime}ms ${data.loadTime < 3000? '<span class="badge badge-green">✅ Fast</span>' : '<span class="badge badge-red">⚠️ Slow</span>'}</p>
        <p><b>Broken Links:</b> ${data.brokenLinks === 0? '<span class="badge badge-green">✅ None</span>' : `<span class="badge badge-red">❌ ${data.brokenLinks} Found</span>`}</p>
        <p><b>Schema Markup:</b> ${data.hasSchemaMarkup? '<span class="badge badge-green">✅ Present</span>' : '<span class="badge badge-red">❌ Missing</span>'}</p>
        <p><b>Robots.txt:</b> ${data.robotsExists ? '<span class="badge badge-green">✅ Found</span>' : '<span class="badge badge-red">❌ Missing</span>'}</p>
        <p><b>Sitemap.xml:</b> ${data.sitemapExists ? '<span class="badge badge-green">✅ Found</span>' : '<span class="badge badge-red">❌ Missing</span>'}</p>
        <p><b>Canonical URL:</b> ${data.hasCanonical ? `<span class="badge badge-green">✅ Found</span><br><small style="margin-left:20px;color:#666">${data.canonical || ''}</small>` : '<span class="badge badge-red">❌ Missing</span>'}</p>
        <p><b>Favicon:</b> ${data.hasFavicon ? `<span class="badge badge-green">✅ Found</span>` : '<span class="badge badge-red">❌ Missing</span>'}</p>
        <p><b>Open Graph:</b> ${data.hasOGTags? '<span class="badge badge-green">✅ Complete - Social Ready</span>' : '<span class="badge badge-red">❌ Missing</span>'}</p>
        ${data.hasOGTags? `
          <p style="font-size: 12px; margin-left: 20px; margin-top: -10px;">
            <b>OG Title:</b> ${data.ogTitle || 'N/A'}<br>
            <b>OG Description:</b> ${(data.ogDescription || 'N/A').substring(0, 60)}...<br>
            <b>OG Image:</b> ${data.ogImage? '✅ Found' : '❌ Missing'}
          </p>
        ` : ''}
        ${data.brokenLinks > 0 && data.brokenLinksList? `
          <details style="font-size: 12px; margin-left: 20px; margin-top: 5px;">
            <summary style="cursor: pointer; color: #dc2626;">View Broken Links</summary>
            <ul style="margin-top: 5px;">
              ${data.brokenLinksList.slice(0, 5).map(link => `<li>${link}</li>`).join("")}
            </ul>
          </details>
        ` : ''}
        
        <h3>📱 Social Media Presence</h3>
        <p><b>Facebook:</b> ${data.hasFacebook ? '<span class="badge badge-green">✅ Found</span>' : '<span class="badge badge-red">❌ Not Found</span>'}</p>
        <p><b>LinkedIn:</b> ${data.hasLinkedIn ? '<span class="badge badge-green">✅ Found</span>' : '<span class="badge badge-red">❌ Not Found</span>'}</p>
        <p><b>YouTube:</b> ${data.hasYouTube ? '<span class="badge badge-green">✅ Found</span>' : '<span class="badge badge-red">❌ Not Found</span>'}</p>
        <p><b>Twitter/X:</b> ${data.hasTwitter ? '<span class="badge badge-green">✅ Found</span>' : '<span class="badge badge-red">❌ Not Found</span>'}</p>
        
        <h3>📞 Contact Information</h3>
        <p><b>Email:</b> ${data.hasEmail ? `<span class="badge badge-green">✅ Found</span><br><small style="margin-left:20px;color:#666">${data.email}</small>` : '<span class="badge badge-red">❌ Not Found</span>'}</p>
        <p><b>Phone:</b> ${data.hasPhone ? `<span class="badge badge-green">✅ Found</span><br><small style="margin-left:20px;color:#666">${data.phone}</small>` : '<span class="badge badge-red">❌ Not Found</span>'}</p>
        
        <h3>🤖 AEO Status - ChatGPT Ready?</h3>
        <p><b>AEO Score:</b> ${data.aeoScore}/100 <span class="badge badge-${data.aeoScore >= 80 ? 'green' : data.aeoScore >= 50 ? 'orange' : 'red'}">${data.aeoStatus}</span></p>
        <p><b>FAQ Schema:</b> ${data.hasFAQ ? '<span class="badge badge-green">✅ Yes - ChatGPT Will Quote</span>' : '<span class="badge badge-red">❌ No</span>'}</p>
        <p><b>HowTo Schema:</b> ${data.hasHowTo ? '<span class="badge badge-green">✅ Yes</span>' : '<span class="badge badge-red">❌ No</span>'}</p>
        <p><b>Direct Answer:</b> ${data.hasDirectAnswer ? '<span class="badge badge-green">✅ Yes - Featured Snippet Ready</span>' : '<span class="badge badge-red">❌ No</span>'}</p>
        <p><b>Schemas Found:</b> ${(data.schemas || []).length ? data.schemas.join(', ') : 'None'}</p>
        
        <h3>🔑 Suggested Keywords</h3>
        <ul>${(data.keywords || []).map(k => `<li>${k}</li>`).join("") || '<li>No keywords found</li>'}</ul>
        
        <h3>💡 SEO Tips</h3>
        <ul>${(data.tips || []).map(t => `<li>${t}</li>`).join("")}</ul>
        
        <h3>⚠️ Issues Found</h3>
        <div class="ai-box">
          ${(data.issues || []).length ? `<ul>${data.issues.map(i => `<li>${i}</li>`).join("")}</ul>` : "No issues found"}
        </div>
        
        <h3>🤖 AI Report</h3>
        <div class="ai-box" style="white-space: pre-wrap;">${data.aiReport || "No AI Report"}</div>
      </div>
    `;
  } catch (err) {
    document.getElementById("loading").style.display = "none";
    document.getElementById("result").innerHTML = `<div class="card">❌ Server Error: ${err.message}</div>`;
  }
}

async function loadHistory() {
  try {
    const res = await fetch(`${API_BASE}/history`);
    const data = await res.json();
    document.getElementById("result").innerHTML = `
      <h3>📊 Scan History</h3>
      ${data.map(item => `
        <div class="card">
          <p><b>URL:</b> ${item.url}</p>
          <p><b>SEO Score:</b> ${item.score} | <b>AEO Score:</b> ${item.aeoScore || 0} | <b>Readability:</b> ${item.readabilityScore || 0}/100</p>
          <p><b>AI Citation:</b> ChatGPT ${item.citationChatGPT || 0}% | Gemini ${item.citationGemini || 0}% | Perplexity ${item.citationPerplexity || 0}%</p>
          <p><b>Status:</b> ${item.status}</p>
          <p><b>FAQ Schema:</b> ${item.hasFAQ ? '✅' : '❌'} | <b>Direct Answer:</b> ${item.hasDirectAnswer ? '✅' : '❌'} | <b>Author:</b> ${item.hasAuthor ? '✅' : '❌'}</p>
          <p><b>Social:</b> ${item.hasFacebook ? 'FB' : ''} ${item.hasLinkedIn ? 'LI' : ''} ${item.hasYouTube ? 'YT' : ''} ${item.hasTwitter ? 'TW' : ''} | <b>Contact:</b> ${item.hasEmail ? 'Email' : ''} ${item.hasPhone ? 'Phone' : ''}</p>
          <p><b>Canonical:</b> ${item.hasCanonical ? '✅' : '❌'} | <b>Favicon:</b> ${item.hasFavicon ? '✅' : '❌'} | <b>Open Graph:</b> ${item.hasOGTags ? '✅' : '❌'} | <b>Sitemap:</b> ${item.sitemapExists ? '✅' : '❌'} | <b>Images:</b> ${item.imagesWithoutAlt || 0}/${item.totalImages || 0} missing ALT</p>
          <p><b>Scanned:</b> ${new Date(item.createdAt).toLocaleString()}</p>
        </div>
      `).join("")}
    `;
  } catch (err) {
    document.getElementById("result").innerHTML = `<div class="card">❌ Failed to load history</div>`;
  }
}

function downloadPDF() {
  const el = document.getElementById("report");
  if (!el) return alert("Scan first!");
  const opt = {
    margin: 10,
    filename: 'seo-aeo-report.pdf',
    image: { type: 'jpeg', quality: 0.98 },
    html2canvas: { scale: 2 },
    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
  };
  html2pdf().from(el).set(opt).save();
}

function toggleDarkMode() {
  document.body.classList.toggle("dark");
}

// Auto scan on load for demo
window.onload = () => {
  // scan();
}
</script>
</body>
</html>
