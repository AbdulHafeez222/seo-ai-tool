provider = "node"

[phases.setup]
aptPackages = [
  "libxcb-shm0",
  "libx11-xcb1",
  "libxrandr2",
  "libxcomposite1",
  "libxcursor1",
  "libxdamage1",
  "libxi6",
  "libxfixes3",
  "libgtk-3-0",
  "libpangocairo-1.0-0",
  "libpango-1.0-0",
  "libatk1.0-0",
  "libcairo-gobject2",
  "libcairo2",
  "libgdk-pixbuf2.0-0",
  "libglib2.0-0",
  "libasound2"
]

[phases.install]
cmds = ["npm install", "npx playwright install chromium"]
